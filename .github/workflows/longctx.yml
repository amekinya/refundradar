name: Long-context probe (live models)
# Actions tab → "Long-context probe" → Run workflow. About $1 of Token Factory credits. Results go to the run summary.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          python -u -m scripts.longctx_probe | tee probe.txt
          sed -n '/^| filler/,$p' probe.txt | tail -12 >> "$GITHUB_STEP_SUMMARY"
