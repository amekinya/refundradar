name: Benchmark (live models)
# Actions tab → "Benchmark (live models)" → Run workflow. Costs roughly $1 of Token Factory credits.
# Or commit a change to .github/requests/eval.json, e.g. {"skip_offers": false, "reuse_routing": false}.
on:
  push:
    paths: [".github/requests/eval.json"]
  workflow_dispatch:
    inputs:
      skip_offers: { description: "Skip the offer-check benchmark", type: boolean, default: false }
      reuse_routing: { description: "Keep the last routing results (saves ~$0.40)", type: boolean, default: false }
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run benchmark
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EVENT: ${{ github.event_name }}
          IN_SKIP_OFFERS: ${{ inputs.skip_offers }}
          IN_REUSE_ROUTING: ${{ inputs.reuse_routing }}
        run: |
          set -o pipefail
          ARGS=$(python3 - <<'PY'
          import json, os
          if os.environ["EVENT"] == "push":
              d = json.load(open(".github/requests/eval.json"))
          else:
              d = {"skip_offers": os.environ.get("IN_SKIP_OFFERS") == "true", "reuse_routing": os.environ.get("IN_REUSE_ROUTING") == "true"}
          print(" ".join(f for f, k in (("--skip-offers", "skip_offers"), ("--reuse-routing", "reuse_routing")) if d.get(k) is True))
          PY
          )
          echo "args: $ARGS"
          python -m eval.run_eval $ARGS
          cat eval/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results.json eval/RESULTS.md
          git commit -m "Update benchmark results" || echo "No changes"
          for i in 1 2 3 4; do if git pull --rebase -q && git push; then exit 0; fi; sleep 7; done
          echo "couldn't push the results"; exit 1